services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: simkodes_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - ./docker/php/php.ini:/usr/local/etc/php/conf.d/custom.ini:ro
    networks:
      - simkodes_network
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    container_name: simkodes_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - simkodes_network
    depends_on:
      - app

  db:
    image: mysql:8.0
    container_name: simkodes_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-simkodes}
      MYSQL_USER: ${DB_USERNAME:-simkodes_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-simkodes_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "3306:3306"
    volumes:
      - simkodes_db_data:/var/lib/mysql
    networks:
      - simkodes_network

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: simkodes_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 64M
    ports:
      - "8080:80"
    networks:
      - simkodes_network
    depends_on:
      - db

volumes:
  simkodes_db_data:
    driver: local

networks:
  simkodes_network:
    driver: bridge
