name: Diagnose & Fix Production 500 Error

on:
  workflow_dispatch:

jobs:
  diagnose-fix:
    name: Diagnose and Fix Production 500 Error
    runs-on: ubuntu-latest
    env:
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || secrets.SSH_PORT || '65002' }}
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST || secrets.SSH_HOST || '195.35.48.228' }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER || secrets.SSH_USER || 'u849825724' }}

    steps:
      - name: 1. Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: 2. Diagnose Database Connections
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << 'EOF'
            echo "=== CEK SQLITE PRODUCTION ==="
            SIM_DB="/home/u849825724/domains/sranak.com/public_html/simkodes/database/database.sqlite"
            if [ -f "$SIM_DB" ]; then
              echo "File SQLite ada: $(ls -lh "$SIM_DB")"
              sqlite3 "$SIM_DB" "SELECT count(*) FROM users;" 2>/dev/null && echo "Berhasil query users via sqlite3" || echo "Gagal query sqlite3"
            fi

            echo "=== CEK MYSQL / MARIADB USERS ==="
            STAGING_ENV="/home/u849825724/domains/sranak.com/public_html/simkodes-staging/.env"
            if [ -f "$STAGING_ENV" ]; then
              STG_PASS=$(grep -i "^DB_PASSWORD=" "$STAGING_ENV" | cut -d '=' -f2- | tr -d '\r"' | tr -d "'")
              STG_USER=$(grep -i "^DB_USERNAME=" "$STAGING_ENV" | cut -d '=' -f2- | tr -d '\r"' | tr -d "'")
              STG_DB=$(grep -i "^DB_DATABASE=" "$STAGING_ENV" | cut -d '=' -f2- | tr -d '\r"' | tr -d "'")

              echo "Staging DB: $STG_DB (User: $STG_USER)"
              mariadb -h 127.0.0.1 -u "$STG_USER" -p"$STG_PASS" "$STG_DB" -e "SELECT 'Staging DB OK' as status, count(*) as total_users FROM users;" 2>/dev/null || echo "Gagal koneksi Staging MySQL"

              # Coba cek apakah user kdmp bisa connect dengan password staging
              echo "Mencoba user u849825724_kdmp dengan password staging..."
              mariadb -h 127.0.0.1 -u "u849825724_kdmp" -p"$STG_PASS" "u849825724_kdmp" -e "SELECT 'KDMP DB OK' as status;" 2>/dev/null && echo "✅ Password staging COCOK dengan u849825724_kdmp!" || echo "❌ Password staging TIDAK cocok dengan kdmp"
            fi
          EOF
