name: Diagnose & Fix Production 500 Error

on:
  workflow_dispatch:

jobs:
  diagnose-fix:
    name: Diagnose and Fix Production 500 Error
    runs-on: ubuntu-latest
    env:
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || secrets.SSH_PORT || '65002' }}
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST || secrets.SSH_HOST || '195.35.48.228' }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER || secrets.SSH_USER || 'u849825724' }}

    steps:
      - name: 1. Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: 2. Diagnose Server Configuration
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << 'EOF'
            echo "=== 1. STRUKTUR DOMAIN & FOLDER ==="
            pwd
            ls -la /home/u849825724/domains/
            ls -la /home/u849825724/domains/sranak.com/public_html/

            TARGET_PATH="/home/u849825724/domains/sranak.com/public_html/simkodes"

            if [ -d "$TARGET_PATH" ]; then
              cd "$TARGET_PATH"
              echo "=== 2. ISI .ENV DI SIMKODES (REDACTED) ==="
              ls -la .env* 2>/dev/null || true
              grep -E "^(APP_|DB_|SESSION_)" .env 2>/dev/null | sed -E 's/(PASSWORD|KEY)=.*/\1=REDACTED/' || echo "Tidak bisa membaca .env"

              echo "=== 3. LARAVEL DATABASE CONFIG ==="
              php -r "
              require 'vendor/autoload.php';
              \$app = require_once 'bootstrap/app.php';
              \$app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              echo 'DB_DEFAULT: ' . config('database.default') . PHP_EOL;
              \$conn = config('database.connections.' . config('database.default'));
              echo 'Driver: ' . (\$conn['driver'] ?? 'N/A') . PHP_EOL;
              echo 'Database: ' . (\$conn['database'] ?? 'N/A') . PHP_EOL;
              echo 'Username: ' . (\$conn['username'] ?? 'N/A') . PHP_EOL;
              echo 'Host: ' . (\$conn['host'] ?? 'N/A') . PHP_EOL;
              echo 'Port: ' . (\$conn['port'] ?? 'N/A') . PHP_EOL;
              echo 'Password Length: ' . strlen(\$conn['password'] ?? '') . PHP_EOL;
              " || true

              echo "=== 4. CEK FILE DATABASE SQLITE ==="
              ls -la database/ 2>/dev/null || true

              echo "=== 5. CEK STAGING .ENV (REDACTED) ==="
              STAGING_PATH="/home/u849825724/domains/sranak.com/public_html/simkodes-staging"
              if [ -d "$STAGING_PATH" ]; then
                grep -E "^(APP_|DB_)" "$STAGING_PATH/.env" 2>/dev/null | sed -E 's/(PASSWORD|KEY)=.*/\1=REDACTED/' || echo "Tidak ada .env di staging"
              fi
            fi
          EOF
