name: Database Backup Automation

on:
  schedule:
    # Berjalan secara terjadwal setiap hari Minggu pukul 02:00 UTC (09:00 WIB)
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      target:
        description: 'Pilih Environment untuk Backup'
        required: true
        type: choice
        options:
          - production
          - staging
        default: 'production'

jobs:
  database-backup:
    name: Backup Remote MySQL Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || secrets.SSH_PORT || '65002' }}
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST || secrets.SSH_HOST || '195.35.48.228' }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER || secrets.SSH_USER || 'u849825724' }}
      TARGET: ${{ github.event.inputs.target || 'production' }}

    steps:
      - name: 1. Setup SSH Key untuk Hostinger
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: 2. Eksekusi Dump Database di Server
        id: dump
        run: |
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          BACKUP_FILENAME="simkodes_${TARGET}_backup_${TIMESTAMP}.sql.gz"
          echo "filename=$BACKUP_FILENAME" >> $GITHUB_OUTPUT

          echo "Menjalankan mysqldump untuk target: $TARGET..."

          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "TARGET='$TARGET' BACKUP_FILENAME='$BACKUP_FILENAME' bash -s" << 'EOF'
            set -eo pipefail

            if [ "$TARGET" = "staging" ]; then
              APP_PATH="/home/u849825724/domains/sranak.com/public_html/simkodes-staging"
            else
              APP_PATH="/home/u849825724/domains/sranak.com/public_html/simkodes"
            fi

            echo "Target: $TARGET"
            echo "Working directory: $APP_PATH"

            # Pastikan folder aplikasi ada
            mkdir -p "$APP_PATH"
            cd "$APP_PATH"

            # Auto-healing & discovery file .env
            if [ ! -f .env ]; then
              echo "⚠️ .env tidak ditemukan di $(pwd). Mencari sumber kredensial..."
              if [ -f "/home/u849825724/domains/sranak.com/public_html/core/.env" ]; then
                echo "✅ Menemukan .env di core/, menyalin ke $(pwd)/.env..."
                cp "/home/u849825724/domains/sranak.com/public_html/core/.env" .env
              elif [ -f "../core/.env" ]; then
                echo "✅ Menemukan .env di ../core/, menyalin ke .env..."
                cp "../core/.env" .env
              elif [ -f ".envprod" ]; then
                echo "✅ Menemukan .envprod, menyalin ke .env..."
                cp .envprod .env
              fi
            fi

            # Ekstrak kredensial dari .env aktif
            DB_DATABASE=""
            DB_USERNAME=""
            DB_PASSWORD=""
            DB_HOST="127.0.0.1"
            DB_PORT="3306"

            if [ -f .env ]; then
              DB_DATABASE=$(grep -m 1 "^DB_DATABASE=" .env | cut -d '=' -f2- | tr -d '\r"' | tr -d "'" | tr -d ' ' || true)
              DB_USERNAME=$(grep -m 1 "^DB_USERNAME=" .env | cut -d '=' -f2- | tr -d '\r"' | tr -d "'" | tr -d ' ' || true)
              DB_PASSWORD=$(grep -m 1 "^DB_PASSWORD=" .env | cut -d '=' -f2- | tr -d '\r"' | tr -d "'" || true)
              DB_HOST=$(grep -m 1 "^DB_HOST=" .env | cut -d '=' -f2- | tr -d '\r"' | tr -d "'" | tr -d ' ' || true)
              DB_PORT=$(grep -m 1 "^DB_PORT=" .env | cut -d '=' -f2- | tr -d '\r"' | tr -d "'" | tr -d ' ' || true)
            fi

            # Fallback jika target production masih belum terbaca dari .env lokal
            if [ -z "$DB_DATABASE" ] && [ "$TARGET" = "production" ]; then
              echo "ℹ️ Membaca kredensial fallback dari core/.env..."
              if [ -f "/home/u849825724/domains/sranak.com/public_html/core/.env" ]; then
                DB_DATABASE=$(grep -m 1 "^DB_DATABASE=" /home/u849825724/domains/sranak.com/public_html/core/.env | cut -d '=' -f2- | tr -d '\r"' | tr -d "'" | tr -d ' ' || true)
                DB_USERNAME=$(grep -m 1 "^DB_USERNAME=" /home/u849825724/domains/sranak.com/public_html/core/.env | cut -d '=' -f2- | tr -d '\r"' | tr -d "'" | tr -d ' ' || true)
                DB_PASSWORD=$(grep -m 1 "^DB_PASSWORD=" /home/u849825724/domains/sranak.com/public_html/core/.env | cut -d '=' -f2- | tr -d '\r"' | tr -d "'" || true)
                DB_HOST=$(grep -m 1 "^DB_HOST=" /home/u849825724/domains/sranak.com/public_html/core/.env | cut -d '=' -f2- | tr -d '\r"' | tr -d "'" | tr -d ' ' || true)
                DB_PORT=$(grep -m 1 "^DB_PORT=" /home/u849825724/domains/sranak.com/public_html/core/.env | cut -d '=' -f2- | tr -d '\r"' | tr -d "'" | tr -d ' ' || true)
              fi
            fi

            if [ -z "$DB_DATABASE" ]; then
              echo "❌ Error: Kredensial database tidak ditemukan di .env!"
              exit 1
            fi

            echo "Koneksi ke database: $DB_DATABASE (User: $DB_USERNAME, Host: ${DB_HOST:-127.0.0.1})..."

            mkdir -p ~/backups_temp
            rm -f ~/backups_temp/"$BACKUP_FILENAME"

            # Eksekusi mysqldump dengan fallback TCP -> Socket
            DUMP_SUCCESS=false

            echo "Mencoba mysqldump via TCP (${DB_HOST:-127.0.0.1}:${DB_PORT:-3306})..."
            if mysqldump --single-transaction --quick -h "${DB_HOST:-127.0.0.1}" -P "${DB_PORT:-3306}" -u "$DB_USERNAME" -p"$DB_PASSWORD" "$DB_DATABASE" 2>/tmp/dump_err.log | gzip > ~/backups_temp/"$BACKUP_FILENAME"; then
              DUMP_SIZE=$(wc -c < ~/backups_temp/"$BACKUP_FILENAME" 2>/dev/null || echo 0)
              if [ "$DUMP_SIZE" -gt 500 ]; then
                echo "✅ Mysqldump via TCP berhasil (Ukuran: $DUMP_SIZE bytes)."
                DUMP_SUCCESS=true
              fi
            fi

            if [ "$DUMP_SUCCESS" = false ]; then
              echo "⚠️ Mysqldump via TCP gagal. Output error:"
              if [ -f /tmp/dump_err.log ]; then cat /tmp/dump_err.log; fi
              echo "Mencoba fallback mysqldump via local socket..."
              
              if mysqldump --single-transaction --quick -u "$DB_USERNAME" -p"$DB_PASSWORD" "$DB_DATABASE" 2>/tmp/dump_err.log | gzip > ~/backups_temp/"$BACKUP_FILENAME"; then
                DUMP_SIZE=$(wc -c < ~/backups_temp/"$BACKUP_FILENAME" 2>/dev/null || echo 0)
                if [ "$DUMP_SIZE" -gt 500 ]; then
                  echo "✅ Mysqldump via socket berhasil (Ukuran: $DUMP_SIZE bytes)."
                  DUMP_SUCCESS=true
                fi
              fi
            fi

            if [ "$DUMP_SUCCESS" = false ]; then
              echo "❌ Error fatal: Mysqldump gagal pada seluruh metode koneksi!"
              if [ -f /tmp/dump_err.log ]; then cat /tmp/dump_err.log; fi
              exit 1
            fi

            echo "✅ Backup database berhasil dibuat di ~/backups_temp/$BACKUP_FILENAME"
          EOF

      - name: 3. Unduh File Backup dari Server ke Runner
        run: |
          mkdir -p ./backups
          scp -P "$SSH_PORT" "$SSH_USER@$SSH_HOST":~/backups_temp/${{ steps.dump.outputs.filename }} ./backups/

          # Bersihkan file sementara di server
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "rm -f ~/backups_temp/${{ steps.dump.outputs.filename }}"

          ls -lh ./backups/

      - name: 4. Upload Backup ke GitHub Artifacts (Retention 30 Hari)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dump.outputs.filename }}
          path: ./backups/${{ steps.dump.outputs.filename }}
          retention-days: 30

      - name: 5. Ringkasan Backup
        run: |
          echo "### 📦 Backup Database Berhasil!" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment:** $TARGET" >> $GITHUB_STEP_SUMMARY
          echo "- **Nama File:** \`${{ steps.dump.outputs.filename }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Ukuran File:** $(du -h ./backups/${{ steps.dump.outputs.filename }} | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Masa Simpan:** 30 Hari di GitHub Actions Artifacts" >> $GITHUB_STEP_SUMMARY
