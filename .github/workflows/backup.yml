name: Database Backup Automation

on:
  schedule:
    # Berjalan secara terjadwal setiap hari Minggu pukul 02:00 UTC (09:00 WIB)
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      target:
        description: 'Pilih Environment untuk Backup'
        required: true
        type: choice
        options:
          - production
          - staging
        default: 'production'

jobs:
  database-backup:
    name: Backup Remote MySQL Database
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || secrets.SSH_PORT || '65002' }}
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST || secrets.SSH_HOST || '195.35.48.228' }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER || secrets.SSH_USER || 'u849825724' }}
      TARGET: ${{ github.event.inputs.target || 'production' }}

    steps:
      - name: 1. Setup SSH Key untuk Hostinger
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: 2. Eksekusi Dump Database di Server
        id: dump
        run: |
          TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
          BACKUP_FILENAME="simkodes_${TARGET}_backup_${TIMESTAMP}.sql.gz"
          echo "filename=$BACKUP_FILENAME" >> $GITHUB_OUTPUT

          echo "Menjalankan database backup untuk target: $TARGET..."

          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "TARGET='$TARGET' BACKUP_FILENAME='$BACKUP_FILENAME' bash -s" << 'EOF'
            set -eo pipefail

            if [ "$TARGET" = "staging" ]; then
              APP_PATH="/home/u849825724/domains/sranak.com/public_html/simkodes-staging"
            else
              APP_PATH="/home/u849825724/domains/sranak.com/public_html/simkodes"
            fi

            echo "Target: $TARGET"
            echo "Working directory: $APP_PATH"

            mkdir -p "$APP_PATH"
            cd "$APP_PATH"

            mkdir -p ~/backups_temp
            rm -f ~/backups_temp/"$BACKUP_FILENAME"

            # Helper untuk ekstrak key dari file env dengan format fleksibel
            extract_val() {
              local file="$1"
              local key="$2"
              if [ -f "$file" ]; then
                grep -i -E "^[[:space:]]*${key}[[:space:]]*=" "$file" 2>/dev/null | head -n 1 | sed -E "s/^[[:space:]]*${key}[[:space:]]*=[[:space:]]*//" | tr -d '\r"' | tr -d "'" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' || true
              fi
            }

            echo "=== 1. Deteksi Engine Database Aktif ==="
            DB_CONNECTION=$(extract_val ".env" "DB_CONNECTION")
            if [ -z "$DB_CONNECTION" ]; then
              if [ -f "database/database.sqlite" ]; then
                DB_CONNECTION="sqlite"
              else
                DB_CONNECTION="mysql"
              fi
            fi
            echo "Engine Database: $DB_CONNECTION"

            DUMP_SUCCESS=false

            # Cabang 1: Engine SQLite
            if [ "$DB_CONNECTION" = "sqlite" ] || [ -f "database/database.sqlite" -a "$TARGET" = "production" -a ! -f ".envprod" ]; then
              echo "ℹ️ Menjalankan prosedur backup untuk SQLite..."
              SQLITE_PATH="database/database.sqlite"
              
              CUSTOM_DB=$(extract_val ".env" "DB_DATABASE")
              if [ -n "$CUSTOM_DB" ] && [ -f "$CUSTOM_DB" ]; then
                SQLITE_PATH="$CUSTOM_DB"
              fi

              if [ ! -f "$SQLITE_PATH" ]; then
                echo "❌ Error: Berkas SQLite tidak ditemukan di $SQLITE_PATH!"
                exit 1
              fi

              SQLITE_SIZE=$(ls -lh "$SQLITE_PATH" | awk '{print $5}')
              echo "Menemukan basis data SQLite: $SQLITE_PATH ($SQLITE_SIZE)"

              if command -v sqlite3 >/dev/null 2>&1; then
                echo "Mengekspor dump SQL menggunakan sqlite3 CLI..."
                sqlite3 "$SQLITE_PATH" .dump | gzip > ~/backups_temp/"$BACKUP_FILENAME"
              else
                echo "sqlite3 CLI tidak tersedia, mengompres berkas database secara langsung..."
                gzip -c "$SQLITE_PATH" > ~/backups_temp/"$BACKUP_FILENAME"
              fi

              DUMP_SIZE=$(wc -c < ~/backups_temp/"$BACKUP_FILENAME" 2>/dev/null || echo 0)
              if [ "$DUMP_SIZE" -gt 500 ]; then
                echo "✅ Backup SQLite berhasil dibuat (Ukuran: $DUMP_SIZE bytes)."
                DUMP_SUCCESS=true
              fi

            # Cabang 2: Engine MySQL / MariaDB
            else
              echo "ℹ️ Menjalankan prosedur backup untuk MySQL / MariaDB..."
              DB_DATABASE=$(extract_val ".env" "DB_DATABASE")
              DB_USERNAME=$(extract_val ".env" "DB_USERNAME")
              DB_PASSWORD=$(extract_val ".env" "DB_PASSWORD")
              DB_HOST=$(extract_val ".env" "DB_HOST")
              DB_PORT=$(extract_val ".env" "DB_PORT")

              if [ -z "$DB_DATABASE" ] || [ -z "$DB_PASSWORD" ]; then
                if [ -f ".envprod" ]; then
                  echo "ℹ️ Mengambil kredensial dari .envprod..."
                  [ -z "$DB_DATABASE" ] && DB_DATABASE=$(extract_val ".envprod" "DB_DATABASE")
                  [ -z "$DB_USERNAME" ] && DB_USERNAME=$(extract_val ".envprod" "DB_USERNAME")
                  [ -z "$DB_PASSWORD" ] && DB_PASSWORD=$(extract_val ".envprod" "DB_PASSWORD")
                  [ -z "$DB_HOST" ] && DB_HOST=$(extract_val ".envprod" "DB_HOST")
                  [ -z "$DB_PORT" ] && DB_PORT=$(extract_val ".envprod" "DB_PORT")
                fi
              fi

              if [ -z "$DB_DATABASE" ] || [ -z "$DB_PASSWORD" ]; then
                if [ -f "bootstrap/cache/config.php" ]; then
                  echo "ℹ️ Mengambil kredensial dari cache konfigurasi Laravel..."
                  [ -z "$DB_DATABASE" ] && DB_DATABASE=$(php -r '$c = require "bootstrap/cache/config.php"; echo $c["database"]["connections"]["mysql"]["database"] ?? "";' 2>/dev/null || true)
                  [ -z "$DB_USERNAME" ] && DB_USERNAME=$(php -r '$c = require "bootstrap/cache/config.php"; echo $c["database"]["connections"]["mysql"]["username"] ?? "";' 2>/dev/null || true)
                  [ -z "$DB_PASSWORD" ] && DB_PASSWORD=$(php -r '$c = require "bootstrap/cache/config.php"; echo $c["database"]["connections"]["mysql"]["password"] ?? "";' 2>/dev/null || true)
                  [ -z "$DB_HOST" ] && DB_HOST=$(php -r '$c = require "bootstrap/cache/config.php"; echo $c["database"]["connections"]["mysql"]["host"] ?? "";' 2>/dev/null || true)
                  [ -z "$DB_PORT" ] && DB_PORT=$(php -r '$c = require "bootstrap/cache/config.php"; echo $c["database"]["connections"]["mysql"]["port"] ?? "";' 2>/dev/null || true)
                fi
              fi

              DB_HOST="${DB_HOST:-127.0.0.1}"
              DB_PORT="${DB_PORT:-3306}"

              echo "Database: $DB_DATABASE | User: $DB_USERNAME | Host: $DB_HOST:$DB_PORT"

              if [ -z "$DB_DATABASE" ] || [ -z "$DB_PASSWORD" ]; then
                echo "❌ Error: Kredensial database MySQL tidak ditemukan di .env!"
                exit 1
              fi

              echo "Mencoba mysqldump via TCP (${DB_HOST}:${DB_PORT})..."
              if mysqldump --single-transaction --quick -h "$DB_HOST" -P "$DB_PORT" -u "$DB_USERNAME" -p"$DB_PASSWORD" "$DB_DATABASE" 2>/tmp/dump_err.log | gzip > ~/backups_temp/"$BACKUP_FILENAME"; then
                DUMP_SIZE=$(wc -c < ~/backups_temp/"$BACKUP_FILENAME" 2>/dev/null || echo 0)
                if [ "$DUMP_SIZE" -gt 500 ]; then
                  echo "✅ Mysqldump via TCP berhasil (Ukuran: $DUMP_SIZE bytes)."
                  DUMP_SUCCESS=true
                fi
              fi

              if [ "$DUMP_SUCCESS" = false ]; then
                echo "⚠️ Mysqldump via TCP gagal, mencoba fallback via local socket..."
                if mysqldump --single-transaction --quick -u "$DB_USERNAME" -p"$DB_PASSWORD" "$DB_DATABASE" 2>/tmp/dump_err.log | gzip > ~/backups_temp/"$BACKUP_FILENAME"; then
                  DUMP_SIZE=$(wc -c < ~/backups_temp/"$BACKUP_FILENAME" 2>/dev/null || echo 0)
                  if [ "$DUMP_SIZE" -gt 500 ]; then
                    echo "✅ Mysqldump via socket berhasil (Ukuran: $DUMP_SIZE bytes)."
                    DUMP_SUCCESS=true
                  fi
                fi
              fi
            fi

            if [ "$DUMP_SUCCESS" = false ]; then
              echo "❌ Error fatal: Backup database gagal!"
              if [ -f /tmp/dump_err.log ]; then cat /tmp/dump_err.log; fi
              exit 1
            fi

            echo "✅ Backup database berhasil dibuat di ~/backups_temp/$BACKUP_FILENAME"
          EOF

      - name: 3. Unduh File Backup dari Server ke Runner
        run: |
          mkdir -p ./backups
          scp -P "$SSH_PORT" "$SSH_USER@$SSH_HOST":~/backups_temp/${{ steps.dump.outputs.filename }} ./backups/

          # Bersihkan file sementara di server
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "rm -f ~/backups_temp/${{ steps.dump.outputs.filename }}"

          ls -lh ./backups/

      - name: 4. Upload Backup ke GitHub Artifacts (Retention 30 Hari)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.dump.outputs.filename }}
          path: ./backups/${{ steps.dump.outputs.filename }}
          retention-days: 30

      - name: 5. Ringkasan Backup
        run: |
          echo "### 📦 Backup Database Berhasil!" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment:** $TARGET" >> $GITHUB_STEP_SUMMARY
          echo "- **Nama File:** \`${{ steps.dump.outputs.filename }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Ukuran File:** $(du -h ./backups/${{ steps.dump.outputs.filename }} | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Masa Simpan:** 30 Hari di GitHub Actions Artifacts" >> $GITHUB_STEP_SUMMARY
