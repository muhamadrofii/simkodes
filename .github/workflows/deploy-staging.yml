name: Deploy to Staging (Hostinger)

on:
  push:
    branches:
      - staging
      - master # Sementara master diaktifkan agar bisa langsung dites
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di tab Actions GitHub

jobs:
  deploy:
    name: Build & Deploy to Staging
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo
          coverage: none

      - name: 3. Install Composer Dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: 4. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 5. Build Assets (Vite)
        run: |
          npm install
          npm run build

      - name: 6. Deploy to Hostinger via Rsync
        uses: easingthemes/ssh-deploy@main
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          TARGET: ${{ secrets.TARGET_STAGING_DIR }}
          EXCLUDES: '/.git/, /.github/, /_archive/, /.env, /storage/logs/*, /storage/framework/cache/*'

      - name: 7. Post-Deployment Commands (Artisan)
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ secrets.TARGET_STAGING_DIR }}
            mkdir -p storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs bootstrap/cache
            chmod -R 775 storage bootstrap/cache
            php artisan optimize:clear
            php artisan migrate --force
            ln -sfn ../storage/app/public public/storage || true

