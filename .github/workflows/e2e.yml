name: Playwright E2E Tests

on:
  push:
    branches:
      - master
      - staging
  pull_request:
    branches:
      - master
      - staging
  workflow_dispatch: # Memungkinkan tombol "Run workflow" manual di GitHub Actions

jobs:
  test-e2e:
    name: Run Playwright E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Checkout Code
        uses: actions/checkout@v4

      - name: 2. Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, sqlite3, bcmath, fileinfo
          coverage: none

      - name: 3. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 4. Install Composer Dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      - name: 5. Install NPM Dependencies & Build Assets
        run: |
          npm ci || npm install
          npm run build

      - name: 6. Setup Test Environment (SQLite)
        run: |
          cp .env.example .env
          sed -i 's/DB_CONNECTION=mysql/DB_CONNECTION=sqlite/g' .env
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --seed --force

      - name: 7. Start Laravel Server (Background)
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 &
          sleep 3

      - name: 8. Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: 9. Run Playwright E2E Tests
        run: npx playwright test
        env:
          BASE_URL: 'http://127.0.0.1:8000'

      - name: 10. Upload Playwright Test Report (Jika Gagal)
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

