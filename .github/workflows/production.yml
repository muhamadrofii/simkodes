name: Continuous Deployment - Production

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Ketik "DEPLOY" untuk konfirmasi rilis ke Production'
        required: true
        default: 'NO'

jobs:
  deploy-production:
    name: Deploy to Live Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || secrets.SSH_PORT || '65002' }}
      SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST || secrets.SSH_HOST || '195.35.48.228' }}
      SSH_USER: ${{ secrets.HOSTINGER_SSH_USER || secrets.SSH_USER || 'u849825724' }}

    steps:
      - name: 1. Verifikasi Konfirmasi Rilis
        run: |
          if [ "${{ github.event.inputs.confirm_deploy }}" != "DEPLOY" ]; then
            echo "Deployment dibatalkan: Konfirmasi tidak sesuai ('${{ github.event.inputs.confirm_deploy }}')."
            exit 1
          fi

      - name: 2. Checkout Repository
        uses: actions/checkout@v4

      - name: 3. Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo
          coverage: none

      - name: 4. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 5. Install Composer Dependencies (Production Optimized)
        run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader

      - name: 6. Install NPM Dependencies & Build Production Assets
        run: |
          npm ci || npm install
          npm run build

      - name: 7. Setup SSH Key untuk Hostinger
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY || secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: "8. Pre-Deployment Safety: Automatic Production Database Snapshot"
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << 'EOF'
            cd /home/u849825724/domains/sranak.com/public_html/simkodes

            if [ -f .env ]; then
              DB_DATABASE=$(grep "^DB_DATABASE=" .env | cut -d '=' -f2 | tr -d '\r"')
              DB_USERNAME=$(grep "^DB_USERNAME=" .env | cut -d '=' -f2 | tr -d '\r"')
              DB_PASSWORD=$(grep "^DB_PASSWORD=" .env | cut -d '=' -f2 | tr -d '\r"')
              DB_HOST=$(grep "^DB_HOST=" .env | cut -d '=' -f2 | tr -d '\r"')

              if [ -n "$DB_DATABASE" ]; then
                TIMESTAMP=$(date +"%Y%m%d_%H%M%S")
                mkdir -p ~/backups_production
                echo "Mengamankan snapshot database live ke ~/backups_production/pre_deploy_${TIMESTAMP}.sql.gz..."
                mysqldump --single-transaction --quick -h "${DB_HOST:-127.0.0.1}" -u "$DB_USERNAME" -p"$DB_PASSWORD" "$DB_DATABASE" | gzip > ~/backups_production/pre_deploy_${TIMESTAMP}.sql.gz
                echo "Snapshot database berhasil diamankan."
              fi
            fi
          EOF

      - name: 9. Rsync Deployment ke Server Live Production
        run: |
          rsync -avz --delete \
            -e "ssh -p $SSH_PORT" \
            --exclude='.env' \
            --exclude='public/member_files/' \
            --exclude='public/officer_files/' \
            --exclude='public/supervisor_files/' \
            --exclude='public/category_images/' \
            --exclude='public/incoming_letters/' \
            --exclude='public/outgoing_letters/' \
            --exclude='public/storage' \
            --exclude='storage/app/public/' \
            --exclude='storage/framework/' \
            --exclude='storage/logs/' \
            --exclude='_archive/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='e2e/' \
            ./ "$SSH_USER@$SSH_HOST":/home/u849825724/domains/sranak.com/public_html/simkodes/

      - name: 10. Post-Deployment Production (Safe Migrate & Optimize)
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" << 'EOF'
            cd /home/u849825724/domains/sranak.com/public_html/simkodes

            # 0. Pastikan file .env ada (Self-healing jika belum tersalin dari core/.env)
            if [ ! -f .env ]; then
              if [ -f /home/u849825724/domains/sranak.com/public_html/core/.env ]; then
                cp /home/u849825724/domains/sranak.com/public_html/core/.env .env
              elif [ -f .envprod ]; then
                cp .envprod .env
              fi
            fi

            # 1. Aktifkan maintenance mode sementara selama proses migrasi
            php artisan down --render="errors::503" || true

            # 2. Setup direktori storage & permission
            mkdir -p storage/framework/{views,cache,sessions} storage/logs
            chmod -R 775 storage bootstrap/cache
            chmod -R 777 storage/framework/sessions storage/framework/views storage/framework/cache storage/logs

            # 3. Bypass batasan symlink Hostinger via shell
            cd public && ln -sfn ../storage/app/public storage || true
            cd ..

            # 4. Migrasi database aman (HANYA migrasi inkremental baru, TANPA fresh / TANPA seed)
            php artisan migrate --force

            # 5. Cache production untuk performa maksimal
            php artisan optimize

            # 6. Kembalikan aplikasi online
            php artisan up
          EOF

