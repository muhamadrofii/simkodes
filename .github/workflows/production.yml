name: Continuous Deployment - Production

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: 'Ketik "DEPLOY" untuk konfirmasi rilis ke Production'
        required: true
        default: 'NO'

jobs:
  deploy-production:
    name: Deploy to Live Production
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. Verifikasi Konfirmasi Rilis
        run: |
          if [ "${{ github.event.inputs.confirm_deploy }}" != "DEPLOY" ]; then
            echo "Deployment dibatalkan: Konfirmasi tidak sesuai ('${{ github.event.inputs.confirm_deploy }}')."
            exit 1
          fi

      - name: 2. Checkout Repository
        uses: actions/checkout@v4

      - name: 3. Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_mysql, bcmath, fileinfo
          coverage: none

      - name: 4. Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 5. Install Composer Dependencies (Production Optimized)
        run: composer install --no-dev --no-progress --prefer-dist --optimize-autoloader

      - name: 6. Install NPM Dependencies & Build Production Assets
        run: |
          npm ci || npm install
          npm run build

      - name: 7. Setup SSH Key untuk Hostinger
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${{ secrets.HOSTINGER_SSH_PORT }} -H "${{ secrets.HOSTINGER_SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: 8. Rsync Deployment ke Server Live Production
        run: |
          rsync -avz --delete \
            -e "ssh -p ${{ secrets.HOSTINGER_SSH_PORT }}" \
            --exclude='.env' \
            --exclude='storage/app/public/' \
            --exclude='storage/logs/' \
            --exclude='_archive/' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='tests/' \
            --exclude='e2e/' \
            ./ ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }}:/home/u849825724/domains/sranak.com/public_html/simkodes/

      - name: 9. Post-Deployment Production (Migrate & Optimize)
        run: |
          ssh -p ${{ secrets.HOSTINGER_SSH_PORT }} ${{ secrets.HOSTINGER_SSH_USER }}@${{ secrets.HOSTINGER_SSH_HOST }} << 'EOF'
            cd /home/u849825724/domains/sranak.com/public_html/simkodes

            mkdir -p storage/framework/{views,cache,sessions} storage/logs
            chmod -R 775 storage bootstrap/cache

            # Bypass batasan symlink Hostinger via shell
            cd public && ln -sfn ../storage/app/public storage || true
            cd ..

            # Migrasi database production
            php artisan migrate --force

            # Cache production untuk performa maksimal
            php artisan optimize
          EOF

